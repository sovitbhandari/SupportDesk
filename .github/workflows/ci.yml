name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-build-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supportdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supportdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supportdesk
      APP_DATABASE_URL: postgresql://app_user:app_user_password@localhost:5432/supportdesk
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run check

      - name: Run migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Verify RLS isolation
        run: npm run db:verify-isolation

      - name: Verify runtime app role
        run: npm --workspace @zendesk-lite/db run verify:runtime-role

      - name: Verify assignment uniqueness
        run: npm --workspace @zendesk-lite/db run verify:assignments

      - name: Verify transactional outbox rollback
        run: npm --workspace @zendesk-lite/db run verify:outbox

      - name: Verify ticket event replay
        run: npm --workspace @zendesk-lite/db run verify:ticket-events
